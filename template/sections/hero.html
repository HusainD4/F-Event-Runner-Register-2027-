<section class="hero-section" id="beranda">
  <div class="container">
    <div class="hero-split-grid hero-no-visual">
      <div class="hero-col-content">
        <div class="hero-pill-badge" id="heroStatusBadge" hidden>
          <span class="status-dot" aria-hidden="true"></span>
          <i class="fa-solid fa-bolt badge-icon" aria-hidden="true"></i>
          <span id="heroStatusText"></span>
        </div>

        <h1 class="hero-title" hidden></h1>
        <p class="hero-desc" hidden></p>

        <div class="hero-actions">
          <button class="btn btn-primary btn-glow" id="heroCtaBtn" hidden>
            <i class="fa-solid fa-ticket" aria-hidden="true"></i> Amankan Slot Lari Sekarang
          </button>
          <button class="btn btn-secondary" id="btnOpenTerms">
            <i class="fa-solid fa-file-contract" aria-hidden="true"></i> Syarat &amp; Ketentuan
          </button>
        </div>

        <div class="countdown-box" id="heroCountdown" hidden>
          <div class="countdown-header">
            <div class="countdown-title-wrap">
              <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
              <span>MENUJU HARI PERLOMBAAN</span>
            </div>
            <div class="event-date-pill" id="eventDateDisplay"></div>
          </div>
          <div class="countdown-grid" aria-label="Hitung mundur menuju hari perlombaan">
            <div class="countdown-card">
              <div class="countdown-num" id="days">--</div>
              <div class="countdown-text">Hari</div>
            </div>
            <div class="countdown-card">
              <div class="countdown-num" id="hours">--</div>
              <div class="countdown-text">Jam</div>
            </div>
            <div class="countdown-card">
              <div class="countdown-num" id="minutes">--</div>
              <div class="countdown-text">Menit</div>
            </div>
            <div class="countdown-card">
              <div class="countdown-num" id="seconds">--</div>
              <div class="countdown-text">Detik</div>
            </div>
          </div>
        </div>
      </div>

      <div class="hero-col-visual" id="heroVisual" hidden>
        <div class="athletic-hero-card">
          <div class="athletic-hero-img-wrap">
            <img id="heroDisplayImg" class="athletic-hero-img" alt="" loading="eager">
            <div class="athletic-card-overlay" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-banner" id="statsBanner" hidden aria-label="Statistik event"></div>
  </div>
</section>
